# OpenClaw LinkedIn Job Scraper Configuration

schedule:
  # Active hours (24h format). Scraper will NOT run outside this window.
  active_hours_start: 8      # 8:00 AM
  active_hours_end: 22        # 10:00 PM
  timezone: "Asia/Kolkata"
  interval_minutes: 60        # How often to scrape (in minutes)

linkedin:
  # LinkedIn job search URL to scrape
  job_url: "https://www.linkedin.com/jobs/search/?currentJobId=4350571362&distance=25&f_TPR=r3600&geoId=102713980&keywords=software%20engineer&origin=JOB_SEARCH_PAGE_JOB_FILTER&refresh=true"

email:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  use_tls: true
  sender: "jobscrapper9@gmail.com"
  # Password is read from the EMAIL_PASSWORD environment variable (never hardcode)
  password_env: "EMAIL_PASSWORD"
  recipient: "jobscrapper9@gmail.com"
  subject_prefix: "[LinkedIn Jobs]"

# OpenClaw / browser automation settings
openclaw:
  headless: false
  # Max time (seconds) to wait for page loads
  page_timeout: 30
  # Max number of job listings to extract per run
  max_jobs: 50
  # Max pages to paginate through (LinkedIn shows ~25 jobs/page)
  max_pages: 3
  # Skip reposted listings
  skip_reposted: true
  # Skip already-viewed listings
  skip_viewed: true
  # Persistent browser profile directory (stores your LinkedIn session)
  # Run `python main.py --login` once to save your session here
  profile_dir: "browser_profile"
